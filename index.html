<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Войти</title>
    <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page">
    <main class="auth-card login-card">
        <p class="eyebrow">ЛИЧНЫЙ КАБИНЕТ</p>
        <h1>Войти по логину</h1>
        <form action="portfolio.html" method="get">
            <label for="login">Логин</label>
            <input type="text" id="login" name="login" placeholder="Введите логин" required>
            <label for="login-password">Пароль</label>
            <input type="password" id="login-password" name="password" placeholder="Введите пароль" required>
            <button type="submit">Войти</button>
        </form>
        <p class="switch-text">Ещё нет аккаунта? <a href="registration.html">Зарегистрироваться</a></p>
    </main>
</body>
</html>
