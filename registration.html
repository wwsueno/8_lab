<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" 
    name="descriptoin" Найдите своего создателя медиа-контента: дизайн, клипмейкинг, копирайт. 
    Наш сайт проверяет личности, как работодателя, так и креатора!>
    <title>Зарегистрироваться на сайт создателей и редакторов медиа-контента</title>
    <link rel="stylesheet" href="css/registration.css">
</head>
<body class="auth-page">
    <form name="test" method="post" action="portfolio.html" class="registration-card">
        <p class="Title">Зарегистрироваться</p>
        <p><!-- Фамилия --><b>Введите ФИО</b><br>
            <input type="text" minlength="2" size="30"
            id="lastname" name="fullname"
            placeholder="Введите Вашу Фамилию" required> *
        </p>
        <p><!-- Имя -->
            <input type="text" minlength="2" size="30"
            id="name" name="fullname"
            placeholder="Введите Ваше Имя" required> *
        </p>
        <p><!-- Отчество -->
            <input type="text" size="30"
            id="middlename" name="fullname"
            placeholder="Введите Ваше Отчество">
        </p><!-- Дата Рождения -->
        <p><b>Введите дату вашего рождения:</b><br>
            <input type="date" size="20" id="date" name="date"> *
        </p><!-- Пол -->
        <p><b>Выберите ваш пол:</b><br>
            <input type="radio" name="sexuality" value="Муж"> Мужской<br>
            <input type="radio" name="sexuality" value="Жен"> Женский<br>
            <input type="radio" name="sexuality" value="Другой"> Другой<br>
        </p>
        <p><!-- Телефон -->
            <input type="tel" size="20" id="tel" name="date"
            pattern="^(\+7|8)\s?(\(9[0-9]{2}\)|9[0-9]{2})\s?\d{3}-?\d{2}-?\d{2}$"
            placeholder="Номер телефона" required>*
        </p>
        <p><!-- Почта -->
            <input type="email" size="20" id="contact-email" name="email"
            placeholder="Электронная почта" required> *
        </p>

        <input type="password" id="password" name="password" maxlength="20"
        placeholder="Введите пароль" required> *
        <input type="password" id="confirmPassword" name="confirmPassword" maxlength="20"
        placeholder="Повторите пароль" required> *

        <p class="form-actions">
            <button type="submit" id="submitButton">Зарегистрироваться</button>
            <input type="reset" value="Очистить">
        </p>
        <p class="switch-text">Уже есть аккаунт? <a href="index.html">Войти</a></p>
    </form>
    <script>
        // Находим поле даты рождения в HTML по указанному id
        // const - переменная с элементом.
        const ageInput = document.getElementById('date');

        // функция checkAge() проверяет возраст пользователя
        function checkAge() {

            // переменная поля даты - строка с датой
            const birthDate = ageInput.value;
            if (birthDate === '') {
                // alert() показывает небольшое окно с сообщением
                alert('Заполните поле с датой рождения.');

                return 0;// return завершает выполнение функции, 0 - проверка не пройдена
            }

            // объект Date с введённой датой позволяет получать год, месяц и день
            const birth = new Date(birthDate);

            // Создаём объект Date с текущими датой и временем устройства
            const today = new Date();

            // getFullYear() возвращает год из даты
            let age = today.getFullYear() - birth.getFullYear();

            // getMonth() возвращает номер месяца от 0 до 11:
            const monthDifference = today.getMonth() - birth.getMonth();

            //текущий месяц < месяца рождения
            //месяцы совпадают, но текущий день < дня рождения
            if (monthDifference < 0 ||
                (monthDifference === 0 && today.getDate() < birth.getDate())) {
                age--; // Если день рождения ещё не наступил, уменьшаем возраст на один год
            }
            if (age < 18) {

                //если пользователю меньше 18 лет, показываем предупреждение
                alert('Отправить заявку можно только по достижению 18 лет.');
                return 0;//возвращаем 0
            } else {
                return 1;
            }
        }

        // Находим форму с атрибутом name="test" и добавляем обработчик события submit (нажатие кнопки)
        document.forms['test'].addEventListener('submit', function(event) {

            // Вызываем функцию проверки возраста.
            if (!checkAge()) {

                // preventDefault() отменяет стандартное действие браузера - отправка формы на сервер.
                event.preventDefault();// Если checkAge() вернула 1, условие будет ложным,
            }// preventDefault() не вызовется, и отправка формы продолжится.
        });
    </script>
    <script src="js/script.js"></script>
</body>
</html>
